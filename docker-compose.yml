services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idk_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idk_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: idk_app
      API_URL: http://backend:8000
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  telegram-bot:
    build:
      context: ./server
    command: python -m app.bot.telegram_bot
    env_file:
      - ./server/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: idk_app
      API_URL: http://backend:8000
    depends_on:
      - backend
    profiles:
      - bot

volumes:
  postgres_data:
  uploads_data:
